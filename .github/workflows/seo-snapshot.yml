name: Weekly SEO snapshot

# Collection is separate from analysis. This job holds the keys and writes raw
# JSON into the repo; an assistant session reads the committed file later and
# never sees a credential. Committing each week also turns the history into git:
# Search Console keeps sixteen months and only shows deltas in its own UI, so
# once a week is archived, comparing two periods is a diff.

on:
  schedule:
    # Monday morning UTC. Off the hour on purpose: every cron written by hand
    # lands on :00 and the runner queue is busiest there.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Every collector warns and exits 0 when its secret is absent. A red cross
      # every week stops being read, and the alert is worthless the day it means
      # something.
      #
      # Several names are passed for the Google key because GitHub offers no way
      # to list the secrets on a repository: a secret that does not exist simply
      # expands to an empty string, so guessing one name and getting it wrong
      # means skipping in silence forever. The collector takes the first one
      # filled and logs which name it used, never the value.
      - name: Google Search Console performance
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
        run: node scripts/collect-gsc.mjs

      # Index coverage. The reading almost nobody takes, and the one that says
      # whether a page can rank at all: performance data cannot distinguish a
      # page that ranks badly from a page Google never indexed.
      #
      # 757 URLs against a 2,000 per day quota, so about 37% of one day, once a
      # week. Everything after this point is continue-on-error so that a later
      # failure still leaves the readings already written to be committed.
      - name: Google index coverage
        continue-on-error: true
        timeout-minutes: 25
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
        run: node scripts/collect-gsc-index.mjs

      - name: Bing Webmaster Tools performance
        continue-on-error: true
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: node scripts/collect-bing.mjs

      # Keyword demand, which is what stops this being a closed loop. Performance
      # data only ever reports queries the site already appears on, so on its own
      # it can improve what exists and can never find demand nobody serves.
      - name: Bing keyword demand
        continue-on-error: true
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: node scripts/collect-bing-keywords.mjs

      # Push never-submitted URLs to Bing. Google has no equivalent for ordinary
      # pages, and on a young domain the crawl is the bottleneck.
      - name: Submit new URLs to Bing
        continue-on-error: true
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: node scripts/submit-bing-urls.mjs

      # Who actually plays, and who subscribes. The search collectors cannot say:
      # to Search Console a click on a reference page and a solved puzzle look
      # identical, which is how the site reached ~600 Bing clicks a week with
      # nobody able to tell whether the game was being used.
      #
      # Counts only. The subscribers endpoint returns email addresses and this
      # repository is public, so the collector drops them and then refuses to
      # write a file in which an address survived anyway.
      - name: Audience and subscribers
        continue-on-error: true
        env:
          STATS_ADMIN_KEY: ${{ secrets.STATS_ADMIN_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: node scripts/collect-audience.mjs

      - name: Commit the readings
        run: |
          if [ -z "$(git status --porcelain seo-snapshots audience-snapshots)" ]; then
            echo "nothing new to archive"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-snapshots audience-snapshots
          git commit -m "Snapshot $(date -u +%Y-%m-%d)"
          git push
