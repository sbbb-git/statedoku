name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    # The weekly snapshot commits into seo-snapshots/ and audience-snapshots/
    # and changes no page. Without this, every archived reading would republish
    # 2,000 pages.
    paths-ignore:
      - 'seo-snapshots/**'
      - 'audience-snapshots/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    # contents: read is all the job uses. deployments: write was only needed
    # for wrangler-action to create GitHub deployments, which it does only when
    # given a gitHubToken, and it is given none.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # IndexNow compares each page with the commit before the push.
          fetch-depth: 0

      - name: Warn when generated files lag behind the pages
        run: |
          python3 scripts/build-llms.py --check || echo "::warning::llms.txt or llms-full.txt is stale: run python3 scripts/build-llms.py"
          python3 scripts/stamp-page-dates.py --check || echo "::warning::page dates are stale: run python3 scripts/build-sitemap-lastmod.py"

      # The daily grids are the core of the site: a red test stops the deploy
      # (past grids unchanged in four time zones, every future grid solvable
      # with two answers or more per cell, the same grid in every zone).
      - name: Test the daily grids
        run: node scripts/test-puzzles.cjs

      - name: Stage the site without the repo-only directories
        run: |
          mkdir -p /tmp/dist
          rsync -a --delete \
            --exclude-from=.deployignore \
            ./ /tmp/dist/
          echo "staged $(find /tmp/dist -name index.html | wc -l) pages"
          # The guard reads the same list rsync used, so a new entry in
          # .deployignore is checked without anyone editing this file. A
          # pattern without a slash matches at any depth for rsync, hence find.
          n=0
          while IFS= read -r p || [ -n "$p" ]; do
            p="${p%$'\r'}"; p="${p%"${p##*[![:space:]]}"}"
            case "$p" in ''|'#'*) continue ;; esac
            n=$((n+1))
            case "$p" in
              */*) hit=$(cd /tmp/dist && ls -d ./${p#/} 2>/dev/null | head -1 || true) ;;
              *)   hit=$(find /tmp/dist -name "$p" -print -quit) ;;
            esac
            if [ -n "$hit" ]; then
              echo "::error::$p reached the deploy directory"; exit 1
            fi
          done < .deployignore
          if [ "$n" -lt 10 ]; then
            echo "::error::.deployignore gave only $n patterns, the guard checked almost nothing"; exit 1
          fi
          echo "deploy guard: $n excluded patterns checked, none present"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy /tmp/dist --project-name=statedoku --branch=main --commit-dirty=true

      # Bing (which ChatGPT search and Copilot answer from) only hears about a
      # page once otherwise. Sends the indexable pages whose reader text
      # changed in this push; warns and carries on if anything fails.
      - name: Tell IndexNow which pages changed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/indexnow.py "$BEFORE" "$GITHUB_SHA"

      # Every sitemap URL in 200, redirects, a real 404, security headers, the
      # asset versions of this commit live, the API and data files answering.
      # Red means the site went live broken: look now.
      - name: Check production
        run: node scripts/verify-production.mjs https://statedoku.com
