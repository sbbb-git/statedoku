name: Cloudflare bot settings check

# Read-only. Reports whether Cloudflare's bot protection could stand between
# Google's ad crawlers (Mediapartners-Google, Google-Display-Ads-Bot) and the
# site during an AdSense review. Prints settings and counts, never the token.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          echo "== token"
          api https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, status: .result.status, errors}'
          echo "== zone"
          Z=$(api "https://api.cloudflare.com/client/v4/zones?name=statedoku.com")
          echo "$Z" | jq -c '{success, errors, count: (.result | length), plan: .result[0].plan.name}'
          ZID=$(echo "$Z" | jq -r '.result[0].id // empty')
          if [ -z "$ZID" ]; then echo "::warning::token cannot read the zone; check the dashboard by hand"; exit 0; fi
          echo "== bot management (fight_mode = Bot Fight Mode)"
          api "https://api.cloudflare.com/client/v4/zones/$ZID/bot_management" | jq -c '{success, errors, result}'
          echo "== security level, browser integrity check, challenge passage"
          for s in security_level browser_check challenge_ttl; do
            api "https://api.cloudflare.com/client/v4/zones/$ZID/settings/$s" | jq -c '{setting: .result.id, value: .result.value, success, errors}'
          done
          echo "== security events on Google crawlers, last 7 days"
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          for UA in Mediapartners-Google Google-Display-Ads-Bot Googlebot AdsBot-Google; do
            Q=$(jq -n --arg z "$ZID" --arg since "$SINCE" --arg ua "%$UA%" '{query: "query($z:String!,$since:Time!,$ua:String!){viewer{zones(filter:{zoneTag:$z}){firewallEventsAdaptiveGroups(limit:20,filter:{datetime_geq:$since,userAgent_like:$ua},orderBy:[count_DESC]){count dimensions{action source}}}}}", variables: {z: $z, since: $since, ua: $ua}}')
            echo "-- $UA"
            api https://api.cloudflare.com/client/v4/graphql -d "$Q" | jq -c '{errors: .errors, events: .data.viewer.zones[0].firewallEventsAdaptiveGroups}'
          done
