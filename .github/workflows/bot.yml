name: Posting bot (Buffer)

# The posting bot is a Cloudflare Worker (bot/), outside the site deploy. It
# reads Cloudflare secrets only, while the Buffer key is kept as a GitHub
# secret, so this workflow carries it across. Run by hand from the Actions tab.
#
#   check   validates BUFFER_TOKEN against Buffer, finds the X channel, and
#           lists the names of the worker's current secrets. Changes nothing.
#   deploy  the same checks, then deploys bot/ and sets BUFFER_TOKEN,
#           BUFFER_CHANNEL_ID and, when those channels are connected,
#           BUFFER_TIKTOK_CHANNEL_ID and BUFFER_YOUTUBE_CHANNEL_ID on the
#           worker. From then on it posts on its crons.
#   post    one post now through Buffer (bot/buffer-post.mjs): target x with
#           text, or target shorts / tiktok / youtube with a video number of
#           data/videos.json. Changes nothing on the worker.
#
# The repo is public and so are these logs: nothing here prints a key or an id.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check changes nothing; deploy turns posting on; post sends one post now'
        type: choice
        options: [check, deploy, post]
        default: check
      target:
        description: 'post only: x (with text), shorts, tiktok or youtube (with video)'
        type: choice
        options: [x, shorts, tiktok, youtube]
        default: x
      text:
        description: 'post to x only: the text'
        type: string
        default: ''
      video:
        description: 'post to shorts, tiktok or youtube only: video number(s) in data/videos.json, comma separated'
        type: string
        default: '1'
      at:
        description: 'optional: as many ISO UTC times as videos, comma separated, to schedule them instead of posting now'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the Buffer key and find the X channel
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: node bot/buffer-check.mjs

      - name: Post once through Buffer
        if: inputs.mode == 'post'
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          POST_TARGET: ${{ inputs.target }}
          POST_TEXT: ${{ inputs.text }}
          POST_VIDEO: ${{ inputs.video }}
          POST_AT: ${{ inputs.at }}
        run: node bot/buffer-post.mjs

      - name: Check the tweet bank served by the site
        run: |
          v=$(curl -s https://statedoku.com/data/tweets.json | python3 -c "import json,sys; b=json.load(sys.stdin); print(b.get('version'), {k: len(v['tweets']) for k, v in b.get('slots', {}).items()})")
          echo "tweets.json live: version $v"
          case "$v" in 2*) ;; *) echo "::error::the site does not serve the two-slot bank (version 2)"; exit 1;; esac

      - name: Check the video list served by the site
        run: |
          v=$(curl -s https://statedoku.com/data/videos.json | python3 -c "import json,sys; b=json.load(sys.stdin); print(b.get('epoch'), len(b.get('videos', [])))" 2>/dev/null || echo "none")
          echo "videos.json live: epoch and count $v"
          first=$(curl -s https://statedoku.com/data/videos.json | python3 -c "import json,sys; print(json.load(sys.stdin)['videos'][0]['url'])" 2>/dev/null || true)
          [ -z "$first" ] || { code=$(curl -s -o /dev/null -w '%{http_code}' "$first"); echo "first video answers $code"; [ "$code" = 200 ] || echo "::warning::the first video URL does not answer 200"; }

      # Wrangler's own output names the Cloudflare account owner and the
      # workers.dev host, and these logs are public: on 16 October 2026 the
      # deployments list put the owner's address in three runs, since deleted.
      # So every wrangler call below writes to a file in RUNNER_TEMP and the
      # log only gets what is printed on purpose.
      - name: Worker secrets currently set (names only)
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@3.114.17 secret list > "$RUNNER_TEMP/secrets.json" 2> "$RUNNER_TEMP/secrets.err"; then
            names=$(python3 -c "import json,re,sys; t=open(sys.argv[1]).read(); m=re.search(r'\[.*\]', t, re.S); print(', '.join(sorted(x['name'] for x in json.loads(m.group(0)))) if m else '')" "$RUNNER_TEMP/secrets.json" 2>/dev/null || true)
            echo "::notice title=Worker secrets::${names:-none}"
          else
            echo "::warning::could not list the worker's secrets (token permission or missing worker)"
            [ "${{ inputs.mode }}" = "check" ] || exit 1
          fi

      - name: Deploy the bot and give it the Buffer secrets
        if: inputs.mode == 'deploy'
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          # BUFFER_CHANNEL_ID comes from the first step, through GITHUB_ENV.
        run: |
          npx --yes wrangler@3.114.17 deploy > "$RUNNER_TEMP/deploy.log" 2>&1 || {
            # Only wrangler's error lines, with addresses, hosts and ids masked.
            grep -E 'ERROR|rror:' "$RUNNER_TEMP/deploy.log" | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g; s/[A-Za-z0-9-]+\.workers\.dev/<host>/g; s/[0-9a-f]{32}/<id>/g' | head -5
            echo "::error::wrangler deploy failed (error lines above, the rest kept out of the public log)"; exit 1; }
          printf '%s' "$BUFFER_TOKEN" | npx --yes wrangler@3.114.17 secret put BUFFER_TOKEN > "$RUNNER_TEMP/s1.log" 2>&1 || { echo "::error::could not set BUFFER_TOKEN"; exit 1; }
          printf '%s' "$BUFFER_CHANNEL_ID" | npx --yes wrangler@3.114.17 secret put BUFFER_CHANNEL_ID > "$RUNNER_TEMP/s2.log" 2>&1 || { echo "::error::could not set BUFFER_CHANNEL_ID"; exit 1; }
          set_list="BUFFER_TOKEN, BUFFER_CHANNEL_ID"
          # The video channels, when buffer-check found them (TikTok and YouTube Shorts in the evening run).
          for name in BUFFER_TIKTOK_CHANNEL_ID BUFFER_YOUTUBE_CHANNEL_ID; do
            val="${!name:-}"
            [ -n "$val" ] || continue
            printf '%s' "$val" | npx --yes wrangler@3.114.17 secret put "$name" > "$RUNNER_TEMP/s-$name.log" 2>&1 || { echo "::error::could not set $name"; exit 1; }
            set_list="$set_list, $name"
          done
          echo "::notice title=Bot deployed::worker deployed, $set_list set"
