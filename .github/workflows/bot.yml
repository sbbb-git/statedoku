name: Posting bot (Buffer)

# The posting bot is a Cloudflare Worker (bot/), outside the site deploy. It
# reads Cloudflare secrets only, while the Buffer key is kept as a GitHub
# secret, so this workflow carries it across. Run by hand from the Actions tab.
#
#   check   validates BUFFER_TOKEN against Buffer, finds the X channel, and
#           lists the names of the worker's current secrets. Changes nothing.
#   deploy  the same checks, then deploys bot/ and sets BUFFER_TOKEN and
#           BUFFER_CHANNEL_ID on the worker. From then on it posts on its crons.
#
# The repo is public and so are these logs: nothing here prints a key or an id.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check changes nothing; deploy turns posting on'
        type: choice
        options: [check, deploy]
        default: check

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the Buffer key and find the X channel
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: node bot/buffer-check.mjs

      - name: Check the tweet bank served by the site
        run: |
          v=$(curl -s https://statedoku.com/data/tweets.json | python3 -c "import json,sys; b=json.load(sys.stdin); print(b.get('version'), {k: len(v['tweets']) for k, v in b.get('slots', {}).items()})")
          echo "tweets.json live: version $v"
          case "$v" in 2*) ;; *) echo "::error::the site does not serve the two-slot bank (version 2)"; exit 1;; esac

      # Wrangler's own output names the Cloudflare account owner and the
      # workers.dev host, and these logs are public: on 16 October 2026 the
      # deployments list put the owner's address in three runs, since deleted.
      # So every wrangler call below writes to a file in RUNNER_TEMP and the
      # log only gets what is printed on purpose.
      - name: Worker secrets currently set (names only)
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@3.114.17 secret list > "$RUNNER_TEMP/secrets.json" 2> "$RUNNER_TEMP/secrets.err"; then
            names=$(python3 -c "import json,re,sys; t=open(sys.argv[1]).read(); m=re.search(r'\[.*\]', t, re.S); print(', '.join(sorted(x['name'] for x in json.loads(m.group(0)))) if m else '')" "$RUNNER_TEMP/secrets.json" 2>/dev/null || true)
            echo "::notice title=Worker secrets::${names:-none}"
          else
            echo "::warning::could not list the worker's secrets (token permission or missing worker)"
            [ "${{ inputs.mode }}" = "check" ] || exit 1
          fi

      - name: Deploy the bot and give it the Buffer secrets
        if: inputs.mode == 'deploy'
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          # BUFFER_CHANNEL_ID comes from the first step, through GITHUB_ENV.
        run: |
          npx --yes wrangler@3.114.17 deploy > "$RUNNER_TEMP/deploy.log" 2>&1 || { echo "::error::wrangler deploy failed (output kept out of the public log)"; exit 1; }
          printf '%s' "$BUFFER_TOKEN" | npx --yes wrangler@3.114.17 secret put BUFFER_TOKEN > "$RUNNER_TEMP/s1.log" 2>&1 || { echo "::error::could not set BUFFER_TOKEN"; exit 1; }
          printf '%s' "$BUFFER_CHANNEL_ID" | npx --yes wrangler@3.114.17 secret put BUFFER_CHANNEL_ID > "$RUNNER_TEMP/s2.log" 2>&1 || { echo "::error::could not set BUFFER_CHANNEL_ID"; exit 1; }
          echo "::notice title=Bot deployed::worker deployed, BUFFER_TOKEN and BUFFER_CHANNEL_ID set"
